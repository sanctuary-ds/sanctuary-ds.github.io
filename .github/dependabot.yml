version: 2
updates:
  # Keeps the GitHub Actions in .github/workflows up to date. They are pinned to commit SHAs;
  # Dependabot updates both the SHA and the version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request per week for all actions, instead of one per action.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Opens the pull request for each new version of the core. The site documents one exact
  # version; CI then checks it (types, tests, and a build that reads that version's changelog),
  # so a breaking change that needs work on the site fails there instead of shipping.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: '@sanctuary-ds/tokens'
    # Waits two days after a release. pnpm rejects any version younger than one day, in CI too
    # (minimumReleaseAge), so the pull request never arrives too early to install; the wait also
    # gives a bad release time to be caught and pulled.
    cooldown:
      default-days: 2
    commit-message:
      prefix: chore(deps)
